name: Build Docker Image and Update Helm Values

on:
  push:
    branches:
      - main
    #paths:
    #  - "app/**"
    #  - "Dockerfile"

env:
  IMAGE_NAME: 0770asd/hello-kube
  HELM_REPO: GG2S/k8s-khw-manifest
  HELM_VALUES_PATH: hello-kube/values.yaml

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Apps Repository Clone
        uses: actions/checkout@v4
      
      - name: set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to DokerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
      
      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:$IMAGE_TAG .

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:$IMAGE_TAG

      - name: Manifest Repository Clone
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HELM_REPO }}
          token: ${{ secrets.MANITEST_REPO_TOKEN }}
          path: manifest
      
      - name: Update image tag in values.yaml
        working-directory: helm-repo
        run: |
          cd manifest
          yq -i '.image.tag = strenv(IMAGE_TAG)' $HELM_VALUES_PATH
        
      - name: Commit and push Helm values Update
        run: |
          cd helm-repo
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add $HELM_VALUES_PATH
          git commit -m "Update image tag to $IMAGE_TAG"
          git push